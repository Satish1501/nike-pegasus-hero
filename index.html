<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

            /* 1. The main box that locks everything together */
.hero-container {
  position: relative;
  display: grid;
  grid-template-columns: repeat(12, 1fr); /* Creates a flexible 12-column layout grid */
  width: 100%;
  max-width: 1200px; /* Limits the layout from stretching infinitely on massive screens */
  margin: 0 auto;    /* Centers the entire block on the page */
  overflow: hidden;
}

/* 2. The background image sits at the root layer */
.Image {
  grid-column: 1 / -1; /* Forces the image to stretch across all 12 columns */
  grid-row: 1;
  width: 100%;
  height: auto;
  object-fit: cover;
  display: block;
}

/* 3. The Content Overlay Layer (This physically locks your text on top of the image) */
.content-overlay {
  grid-column: 1 / -1;
  grid-row: 1;
  z-index: 2;
  
  /* Standard Padding using percentage/viewport units so it scales with zoom */
  padding: 4%; 
  
  /* Flexbox settings to neatly stack all your headings down the page */
  display: flex;
  flex-direction: column;
  align-items: flex-start; /* Aligns everything nicely to the left */
}

/* 4. Individual Clean Typographies (No top/left hacks!) */
.Logo {
  width: 60px;
  height: auto;
  margin-bottom: 20px;
}

.h1 {
  font-size: clamp(2rem, 5vw, 4rem); /* Scales text dynamically with window size/zoom */
  margin: 0 0 10px 0;
  color: white;
}

.intro {
  font-size: clamp(0.9rem, 1.5vw, 1.2rem);
  letter-spacing: 0.2em;
  margin: 0 0 5px 0;
  color: white;
}

.Air {
  font-size: clamp(1.8rem, 4vw, 3.5rem);
  font-weight: bold;
  margin: 0;
  line-height: 1.1;
  color: white;
}

.Pegasus {
    font-size: clamp(1.8rem, 4vw, 3.5rem);
    font-weight: bold;
    margin: 0;
    line-height: 1.1;
    color: rgb(187, 252, 122);
}

.More {
  font-size: clamp(1rem, 2vw, 1.5rem);
  margin: 20px 0;
  color: white;
}

.Shopnow {
  background-color: #CCFF00;
  color: #fff;
  border: none;
  padding: 12px 28px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 30px;
  cursor: pointer;
  transition: 0.2s ease;
  margin-bottom: 20px;
  color: white;
}

.Shopnow:hover {
  background-color: #333;
}

.Paragraph {
  font-size: clamp(0.85rem, 1.5vw, 1.1rem);
  line-height: 1.5;
  color: white;
  margin-bottom: 40px;
}

/* 5. Bottom Feature Block */
.tech-box {
  margin-top: auto; /* Pushes the technology box to the bottom area safely */
}

.Final_container {
  grid-column: 1 / -1; /* Forces the image to stretch across all 12 columns */
  grid-row: 5;
  width: 100%;
  height: auto;
  object-fit: cover;
  display: flex;
  top: 20px;
}




    </style>
</head>
<body>

    <div class="hero-container">
    <!-- Background Image -->
    <img class="Image" src="./bg-image.PNG" alt="Background">
    
    <!-- Text and Button Layer Overlapping the Image -->
    <div class="content-overlay">
        <img class="Logo" src="./download-1.png" alt="Logo">
        
        <h1 class="h1">Nike</h1>
        <h3 class="intro">I&nbspN&nbspT&nbspR&nbspO&nbspD&nbspU&nbspC&nbspI&nbspN&nbspG</h3>
        <h2 class="Air">Nike Air Zoom</h2>
        <h2 class="Pegasus">PEGASUS 41</h2>

        <p class="More">More Cushion. More Energy. <br> More Miles.</p>

        <form action="https://nike.com" target="_blank">
            <button type="submit" class="Shopnow">Shop Now <span>→</span></button>
        </form>
        <img class="Final_container" src="./images-removebg-preview.png" alt="Images">
        
    </div>
    
</div>



    
</body>
</html>
